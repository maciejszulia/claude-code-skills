<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 269" width="960" font-family="'JetBrains Mono', ui-monospace, Menlo, Consolas, 'DejaVu Sans Mono', monospace" font-size="12.5" role="img" aria-label="The reader learns what the project does in 30 s and runs it in 5 min. After a large commit without README changes, readme-guard asks for one.">
<rect width="960" height="269" fill="#ffffff"/>
<defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#111111"/></marker></defs>
