<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 286" width="960" font-family="'JetBrains Mono', ui-monospace, Menlo, Consolas, 'DejaVu Sans Mono', monospace" font-size="12.5" role="img" aria-label="Each task goes to the cheapest model that does it well. A stronger model reviews the result; a miss becomes a runbook row or a test.">
<rect width="960" height="286" fill="#ffffff"/>
<defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#111111"/></marker></defs>
<text x="16" y="32" font-size="15" font-weight="bold" fill="#111111">Each task goes to the cheapest model that does it well.</text>
<text x="16" y="53" font-size="15" font-weight="bold" fill="#111111">A stronger model reviews the result; a miss becomes a runbook row or a test.</text>
<polyline points="230,114 254,114" fill="none" stroke="#111111" stroke-width="1.5" marker-end="url(#arrow)"/>
<polyline points="468,114 492,114" fill="none" stroke="#111111" stroke-width="1.5" marker-end="url(#arrow)"/>
<polyline points="706,114 730,114" fill="none" stroke="#111111" stroke-width="1.5" marker-end="url(#arrow)"/>
<polyline points="837,156 837,171 123,171 123,186" fill="none" stroke="#111111" stroke-width="1.5" marker-end="url(#arrow)"/>
<polyline points="230,228 254,228" fill="none" stroke="#111111" stroke-width="1.5" marker-end="url(#arrow)"/>
<polyline points="468,228 492,228" fill="none" stroke="#111111" stroke-width="1.5" marker-end="url(#arrow)"/>
<polyline points="706,228 730,228" fill="none" stroke="#111111" stroke-width="1.5" marker-end="url(#arrow)"/>
<rect x="16" y="72" width="214" height="84" fill="#ffffff" stroke="#111111" stroke-width="1.5"/>
<text x="24" y="101.5" fill="#111111" font-weight="bold">Owner</text>
<text x="24" y="118.5" fill="#111111">gives the order;</text>
<text x="24" y="135.5" fill="#111111">decides class C</text>
<rect x="254" y="72" width="214" height="84" fill="#ffffff" stroke="#c8102e" stroke-width="2"/>
<text x="262" y="93" fill="#c8102e" font-weight="bold">Lead: Fable 5.2</text>
<text x="262" y="110" fill="#111111">plans, decides,</text>
<text x="262" y="127" fill="#111111">writes the runbook,</text>
<text x="262" y="144" fill="#111111">asks Haiku if stuck</text>
<rect x="492" y="72" width="214" height="84" fill="#ffffff" stroke="#111111" stroke-width="1.5"/>
<text x="500" y="93" fill="#111111" font-weight="bold">Worker: Opus 5.5</text>
<text x="500" y="110" fill="#111111">code, tests,</text>
<text x="500" y="127" fill="#111111">measurements,</text>
<text x="500" y="144" fill="#111111">queues</text>
<rect x="730" y="72" width="214" height="84" fill="#ffffff" stroke="#111111" stroke-width="1.5"/>
<text x="738" y="93" fill="#111111" font-weight="bold">Executor: Sonnet 5.5</text>
<text x="738" y="110" fill="#111111">repetitive work</text>
<text x="738" y="127" fill="#111111">from the runbook;</text>
<text x="738" y="144" fill="#111111">stops at a new fact</text>
<rect x="16" y="186" width="214" height="84" fill="#ffffff" stroke="#111111" stroke-width="1.5"/>
<text x="24" y="215.5" fill="#111111" font-weight="bold">Ledger</text>
<text x="24" y="232.5" fill="#111111">one row per result,</text>
<text x="24" y="249.5" fill="#111111">with evidence</text>
<rect x="254" y="186" width="214" height="84" fill="#ffffff" stroke="#111111" stroke-width="1.5"/>
<text x="262" y="207" fill="#111111" font-weight="bold">Check: Opus 5.5</text>
<text x="262" y="224" fill="#111111">each row against</text>
<text x="262" y="241" fill="#111111">its evidence;</text>
<text x="262" y="258" fill="#111111">commit</text>
<rect x="492" y="186" width="214" height="84" fill="#ffffff" stroke="#111111" stroke-width="1.5"/>
<text x="500" y="207" fill="#111111" font-weight="bold">Accept: Fable 5.2</text>
<text x="500" y="224" fill="#111111">reads the check,</text>
<text x="500" y="241" fill="#111111">pushes, reports</text>
<text x="500" y="258" fill="#111111">to the owner</text>
<rect x="730" y="186" width="214" height="84" fill="#ffffff" stroke="#c8102e" stroke-width="2"/>
<text x="738" y="207" fill="#c8102e" font-weight="bold">Rule update</text>
<text x="738" y="224" fill="#111111">a miss becomes a</text>
<text x="738" y="241" fill="#111111">new runbook row</text>
<text x="738" y="258" fill="#111111">or a test</text>
</svg>
