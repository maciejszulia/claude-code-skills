<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 286" width="960" font-family="'JetBrains Mono', ui-monospace, Menlo, Consolas, 'DejaVu Sans Mono', monospace" font-size="12.5" role="img" aria-label="When a usage limit ends the lead session, the work moves to the next lead. Fable 5.2 reads the handoff, runs drift-check first, then gives out the queue.">
<rect width="960" height="286" fill="#ffffff"/>
<defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#111111"/></marker></defs>
<text x="16" y="32" font-size="15" font-weight="bold" fill="#111111">When a usage limit ends the lead session, the work moves to the next lead.</text>
<text x="16" y="53" font-size="15" font-weight="bold" fill="#111111">Fable 5.2 reads the handoff, runs drift-check first, then gives out the queue.</text>
<polyline points="230,114 254,114" fill="none" stroke="#111111" stroke-width="1.5" marker-end="url(#arrow)"/>
<polyline points="468,114 492,114" fill="none" stroke="#111111" stroke-width="1.5" marker-end="url(#arrow)"/>
<polyline points="706,114 730,114" fill="none" stroke="#111111" stroke-width="1.5" marker-end="url(#arrow)"/>
<polyline points="837,156 837,186" fill="none" stroke="#111111" stroke-width="1.5" marker-end="url(#arrow)"/>
<rect x="16" y="72" width="214" height="84" fill="#ffffff" stroke="#111111" stroke-width="1.5"/>
<text x="24" y="93" fill="#111111" font-weight="bold">Limit at 90 %</text>
<text x="24" y="110" fill="#111111">limit-guard asks</text>
<text x="24" y="127" fill="#111111">the owner what</text>
<text x="24" y="144" fill="#111111">happens next</text>
<rect x="254" y="72" width="214" height="84" fill="#ffffff" stroke="#111111" stroke-width="1.5"/>
<text x="262" y="93" fill="#111111" font-weight="bold">Hand over</text>
<text x="262" y="110" fill="#111111">handoff page in</text>
<text x="262" y="127" fill="#111111">SilverBullet and</text>
<text x="262" y="144" fill="#111111">a pending file</text>
<rect x="492" y="72" width="214" height="84" fill="#ffffff" stroke="#111111" stroke-width="1.5"/>
<text x="500" y="93" fill="#111111" font-weight="bold">Take over</text>
<text x="500" y="110" fill="#111111">Fable 5.2, max effort,</text>
<text x="500" y="127" fill="#111111">reads the handoff</text>
<text x="500" y="144" fill="#111111">in full</text>
<rect x="730" y="72" width="214" height="84" fill="#ffffff" stroke="#c8102e" stroke-width="2"/>
<text x="738" y="101.5" fill="#c8102e" font-weight="bold">drift-check</text>
<text x="738" y="118.5" fill="#111111">first, before</text>
<text x="738" y="135.5" fill="#111111">any new work</text>
<rect x="730" y="186" width="214" height="84" fill="#ffffff" stroke="#111111" stroke-width="1.5"/>
<text x="738" y="207" fill="#111111" font-weight="bold">Queue</text>
<text x="738" y="224" fill="#111111">Opus, Sonnet, Haiku,</text>
<text x="738" y="241" fill="#111111">Hermes; the lead</text>
<text x="738" y="258" fill="#111111">decides and receives</text>
</svg>
