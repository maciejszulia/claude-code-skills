<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 286" width="960" font-family="'JetBrains Mono', ui-monospace, Menlo, Consolas, 'DejaVu Sans Mono', monospace" font-size="12.5" role="img" aria-label="The change is told as a story in run-time order. Every step that departs from the owner's latest stated intent is bold.">
<rect width="960" height="286" fill="#ffffff"/>
<defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#111111"/></marker></defs>
<text x="16" y="32" font-size="15" font-weight="bold" fill="#111111">The change is told as a story in run-time order.</text>
<text x="16" y="53" font-size="15" font-weight="bold" fill="#111111">Every step that departs from the owner's latest stated intent is bold.</text>
<polyline points="230,114 254,114" fill="none" stroke="#111111" stroke-width="1.5" marker-end="url(#arrow)"/>
<polyline points="468,114 492,114" fill="none" stroke="#111111" stroke-width="1.5" marker-end="url(#arrow)"/>
<polyline points="706,114 730,114" fill="none" stroke="#111111" stroke-width="1.5" marker-end="url(#arrow)"/>
<polyline points="837,156 837,186" fill="none" stroke="#111111" stroke-width="1.5" marker-end="url(#arrow)"/>
<rect x="16" y="72" width="214" height="84" fill="#ffffff" stroke="#111111" stroke-width="1.5"/>
<text x="24" y="93" fill="#111111" font-weight="bold">Intent</text>
<text x="24" y="110" fill="#111111">the owner's latest</text>
<text x="24" y="127" fill="#111111">statement, quoted</text>
<text x="24" y="144" fill="#111111">in one line</text>
<rect x="254" y="72" width="214" height="84" fill="#ffffff" stroke="#111111" stroke-width="1.5"/>
<text x="262" y="93" fill="#111111" font-weight="bold">Diff</text>
<text x="262" y="110" fill="#111111">what actually exists:</text>
<text x="262" y="127" fill="#111111">git diff base...HEAD,</text>
<text x="262" y="144" fill="#111111">read end to end</text>
<rect x="492" y="72" width="214" height="84" fill="#ffffff" stroke="#111111" stroke-width="1.5"/>
<text x="500" y="93" fill="#111111" font-weight="bold">Narrate</text>
<text x="500" y="110" fill="#111111">numbered steps in</text>
<text x="500" y="127" fill="#111111">run-time order, each</text>
<text x="500" y="144" fill="#111111">with its file:line</text>
<rect x="730" y="72" width="214" height="84" fill="#ffffff" stroke="#c8102e" stroke-width="2"/>
<text x="738" y="93" fill="#c8102e" font-weight="bold">Mark the drift</text>
<text x="738" y="110" fill="#111111">bold where the change</text>
<text x="738" y="127" fill="#111111">adds, skips or does it</text>
<text x="738" y="144" fill="#111111">differently</text>
<rect x="730" y="186" width="214" height="84" fill="#ffffff" stroke="#111111" stroke-width="1.5"/>
<text x="738" y="207" fill="#111111" font-weight="bold">List "Drift"</text>
<text x="738" y="224" fill="#111111">one line per item and</text>
<text x="738" y="241" fill="#111111">one question each:</text>
<text x="738" y="258" fill="#111111">keep, revert or change</text>
</svg>
