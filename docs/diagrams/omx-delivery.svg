<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 303" width="960" font-family="'JetBrains Mono', ui-monospace, Menlo, Consolas, 'DejaVu Sans Mono', monospace" font-size="12.5" role="img" aria-label="The order is a committed file, the worker gets one sentence, and the lead re-runs the gates before accepting the branch.">
<rect width="960" height="303" fill="#ffffff"/>
<defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#111111"/></marker></defs>
<text x="16" y="32" font-size="15" font-weight="bold" fill="#111111">The order is a committed file, the worker gets one sentence,</text>
<text x="16" y="53" font-size="15" font-weight="bold" fill="#111111">and the lead re-runs the gates before accepting the branch.</text>
<polyline points="230,122.5 254,122.5" fill="none" stroke="#111111" stroke-width="1.5" marker-end="url(#arrow)"/>
<polyline points="468,122.5 492,122.5" fill="none" stroke="#111111" stroke-width="1.5" marker-end="url(#arrow)"/>
<polyline points="706,122.5 730,122.5" fill="none" stroke="#111111" stroke-width="1.5" marker-end="url(#arrow)"/>
<polyline points="837,173 837,188 123,188 123,203" fill="none" stroke="#111111" stroke-width="1.5" marker-end="url(#arrow)"/>
<polyline points="230,245 254,245" fill="none" stroke="#111111" stroke-width="1.5" marker-end="url(#arrow)"/>
<polyline points="468,245 492,245" fill="none" stroke="#111111" stroke-width="1.5" marker-end="url(#arrow)"/>
<rect x="16" y="72" width="214" height="101" fill="#ffffff" stroke="#111111" stroke-width="1.5"/>
<text x="24" y="93" fill="#111111" font-weight="bold">Order file</text>
<text x="24" y="110" fill="#111111">docs/orders/&lt;slug&gt;.md</text>
<text x="24" y="127" fill="#111111">problem, outcome, gates,</text>
<text x="24" y="144" fill="#111111">forbidden paths;</text>
<text x="24" y="161" fill="#111111">committed before launch</text>
<rect x="254" y="72" width="214" height="101" fill="#ffffff" stroke="#111111" stroke-width="1.5"/>
<text x="262" y="101.5" fill="#111111" font-weight="bold">Launch</text>
<text x="262" y="118.5" fill="#111111">omx --worktree=&lt;name&gt;</text>
<text x="262" y="135.5" fill="#111111">Codex leader in its own</text>
<text x="262" y="152.5" fill="#111111">git worktree, in tmux</text>
<rect x="492" y="72" width="214" height="101" fill="#ffffff" stroke="#111111" stroke-width="1.5"/>
<text x="500" y="110" fill="#111111" font-weight="bold">Hand over</text>
<text x="500" y="127" fill="#111111">one sentence that</text>
<text x="500" y="144" fill="#111111">points at the order file</text>
<rect x="730" y="72" width="214" height="101" fill="#ffffff" stroke="#111111" stroke-width="1.5"/>
<text x="738" y="101.5" fill="#111111" font-weight="bold">Watch</text>
<text x="738" y="118.5" fill="#111111">git log and git status</text>
<text x="738" y="135.5" fill="#111111">of the worktree,</text>
<text x="738" y="152.5" fill="#111111">every minute</text>
<rect x="16" y="203" width="214" height="84" fill="#ffffff" stroke="#c8102e" stroke-width="2"/>
<text x="24" y="224" fill="#c8102e" font-weight="bold">Receive</text>
<text x="24" y="241" fill="#111111">re-run the named gates</text>
<text x="24" y="258" fill="#111111">from the worktree,</text>
<text x="24" y="275" fill="#111111">quote the counts</text>
<rect x="254" y="203" width="214" height="84" fill="#ffffff" stroke="#111111" stroke-width="1.5"/>
<text x="262" y="232.5" fill="#111111" font-weight="bold">Scope check</text>
<text x="262" y="249.5" fill="#111111">only the named files,</text>
<text x="262" y="266.5" fill="#111111">no live state touched</text>
<rect x="492" y="203" width="214" height="84" fill="#ffffff" stroke="#111111" stroke-width="1.5"/>
<text x="500" y="232.5" fill="#111111" font-weight="bold">Accept or refuse</text>
<text x="500" y="249.5" fill="#111111">merge, build and deploy</text>
<text x="500" y="266.5" fill="#111111">stay with the lead</text>
</svg>
